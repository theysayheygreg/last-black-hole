<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Last Singularity</title>
  <style>
    @font-face {
      font-family: 'Oxanium';
      src: url('./assets/fonts/oxanium/Oxanium-Variable.ttf') format('truetype');
      font-weight: 200 800;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Monaspace Neon';
      src: url('./assets/fonts/monaspace/MonaspaceNeonVar.woff2') format('woff2');
      font-weight: 200 800;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Monaspace Argon';
      src: url('./assets/fonts/monaspace/MonaspaceArgonVar.woff2') format('woff2');
      font-weight: 200 800;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Monaspace Krypton';
      src: url('./assets/fonts/monaspace/MonaspaceKryptonVar.woff2') format('woff2');
      font-weight: 200 800;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Monaspace Xenon';
      src: url('./assets/fonts/monaspace/MonaspaceXenonVar.woff2') format('woff2');
      font-weight: 200 800;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Monaspace Radon';
      src: url('./assets/fonts/monaspace/MonaspaceRadonVar.woff2') format('woff2');
      font-weight: 200 800;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Noto Sans Mono';
      src: url('./assets/fonts/noto/NotoSansMono-Variable.ttf') format('truetype');
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Noto Sans Symbols';
      src: url('./assets/fonts/noto/NotoSansSymbols-Variable.ttf') format('truetype');
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }
    :root {
      --lbh-font-display: 'Oxanium', 'Monaspace Neon', 'Monaspace Argon', sans-serif;
      --lbh-font-ui: 'Monaspace Neon', 'Monaspace Argon', 'JetBrains Mono', 'SF Mono', 'Fira Code', monospace;
      --lbh-font-glyph: 'Monaspace Neon', 'Monaspace Argon', 'Noto Sans Mono', 'Noto Sans Symbols', 'Apple Symbols', 'Segoe UI Symbol', monospace;
      --lbh-font-mono: var(--lbh-font-ui);
      --lbh-void: #000021;
      --lbh-panel-bg: rgba(0, 2, 10, 0.78);
      --lbh-panel-backing: rgba(0, 0, 8, 0.56);
      --lbh-panel-shadow: 4px 6px 12px rgba(0, 0, 8, 0.72);
      --lbh-text-shadow: 2px 3px 5px rgba(0, 0, 8, 0.9);
      --lbh-panel-border: rgba(0, 226, 255, 0.32);
      --lbh-text-primary: rgba(234, 247, 255, 0.94);
      --lbh-text-muted: rgba(154, 180, 206, 0.72);
      --lbh-timer-normal: rgba(234, 247, 255, 0.9);
      --lbh-timer-glow: rgba(0, 226, 255, 0.28);
      --lbh-signal: rgba(0, 226, 255, 0.9);
      --lbh-signal-label: rgba(0, 226, 255, 0.62);
      --lbh-danger: rgba(255, 51, 54, 0.95);
      --lbh-ecology: rgba(56, 245, 138, 0.9);
      --lbh-inhibitor: rgba(255, 62, 181, 0.95);
      --lbh-inhibitor-glow: rgba(255, 62, 181, 0.55);
      --lbh-portal: rgba(0, 226, 255, 0.9);
      --lbh-salvage: rgba(255, 185, 56, 0.92);
      --lbh-track-bg: rgba(24, 38, 52, 0.7);
      --lbh-warning-shadow: rgba(0, 0, 0, 0.8);
      --lbh-panel-radius: 2px;
      --lbh-edge-margin: 24px;
      --lbh-couch-micro: 13px;
      --lbh-couch-small: 14px;
      --lbh-couch-body: 15px;
      --lbh-couch-button: 18px;
      --lbh-gauge-height: 16px;
      --lbh-hud-gap: 8px;
      --lbh-deck-panel-pad-y: 18px;
      --lbh-deck-panel-pad-x: 22px;
      --lbh-deck-panel-gap: 10px;
      --lbh-deck-row-min: 58px;
      --lbh-deck-icon-min: 44px;
      --lbh-deck-value-min: 52px;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--lbh-void);
      cursor: crosshair;
      font-family: var(--lbh-font-ui);
      font-variant-ligatures: none;
      font-feature-settings: "liga" 0, "calt" 0;
    }
    /* Canvases are sized by viewport.js (fixed 1280x720 backing,
       letterboxed CSS rect). Explicit left/top are written by JS. */
    #fluid-canvas,
    #three-canvas {
      position: fixed;
      z-index: 0;
      image-rendering: pixelated;
    }
    #three-canvas {
      display: none;
      pointer-events: none;
    }
    #overlay-canvas {
      position: fixed;
      z-index: 1;
      pointer-events: auto;
      image-rendering: pixelated;
    }
    #min-window-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      background: #000;
      color: rgba(200, 210, 225, 0.9);
      font-family: var(--lbh-font-mono);
      font-size: 14px;
      letter-spacing: 0;
      text-transform: lowercase;
      text-align: center;
      padding: 24px;
    }
    #min-window-overlay .min-window-title {
      font-size: 18px;
      letter-spacing: 0;
      color: rgba(220, 230, 245, 1.0);
    }
    #min-window-overlay .min-window-hint {
      font-size: 11px;
      color: rgba(140, 160, 185, 0.7);
    }
    /* HUD — terminal aesthetic */
    #hud {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 10;
      pointer-events: none;
      font-family: var(--lbh-font-mono);
      font-variant-ligatures: none;
      font-feature-settings: "liga" 0, "calt" 0;
      user-select: none;
    }
    #hud .hud-panel {
      position: absolute;
      font-size: var(--lbh-couch-small);
      letter-spacing: 0;
      padding: var(--lbh-deck-panel-pad-y) var(--lbh-deck-panel-pad-x);
      background: var(--lbh-panel-bg);
      border: 1px solid var(--lbh-panel-border);
      border-radius: var(--lbh-panel-radius);
      min-height: var(--lbh-deck-value-min);
      backdrop-filter: blur(2px);
      box-shadow: var(--lbh-panel-shadow);
      text-shadow: var(--lbh-text-shadow);
    }
    #hud-collapse {
      top: 12px; left: var(--lbh-edge-margin);
      color: var(--lbh-timer-normal);
      text-shadow: 0 0 6px var(--lbh-timer-glow);
      line-height: 1.25;
      border-color: rgba(234, 247, 255, 0.18);
    }
    #hud-collapse .hud-label {
      font-size: var(--lbh-couch-micro);
      letter-spacing: 0;
      color: var(--lbh-text-muted);
      text-transform: uppercase;
    }
    #hud-collapse .hud-value {
      font-size: 24px;
      font-weight: bold;
    }
    #hud-collapse .hud-sub {
      font-size: var(--lbh-couch-micro);
      color: rgba(140, 160, 190, 0.65);
    }
    #hud-vitals {
      top: 120px;
      left: var(--lbh-edge-margin);
      width: 270px;
      display: grid;
      gap: var(--lbh-deck-panel-gap);
      padding: var(--lbh-deck-panel-pad-y) var(--lbh-deck-panel-pad-x);
      color: var(--lbh-text-primary);
      border-color: rgba(234, 247, 255, 0.2);
    }
    #hud-vitals .hud-vital {
      position: static;
      min-height: 0;
      padding: 0;
      background: none;
      border: 0;
      text-align: left;
      line-height: 1.25;
    }
    #hud-vitals .hud-vital-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      min-height: 20px;
    }
    #hud-vitals .hud-label {
      font-size: var(--lbh-couch-small);
      letter-spacing: 0;
      text-transform: uppercase;
    }
    #hud-vitals .hud-vital-readout {
      font-size: var(--lbh-couch-body);
      font-weight: 650;
      color: var(--lbh-text-primary);
      text-align: right;
    }
    #hud-signal {
      color: var(--lbh-signal);
      text-shadow: 0 0 6px rgba(0, 226, 255, 0.32);
    }
    #hud-signal .hud-label {
      font-size: var(--lbh-couch-micro);
      letter-spacing: 0;
      color: var(--lbh-signal-label);
      text-transform: uppercase;
    }
    #hud-signal-bar {
      width: 100%; height: 18px;
      background: var(--lbh-track-bg);
      border: 1px solid rgba(234, 247, 255, 0.14);
      border-radius: 2px;
      margin: 4px 0 0;
      overflow: hidden;
    }
    #hud-signal-fill {
      height: 100%;
      width: 0%;
      border-radius: 2px;
      transition: width 0.15s, background-color 0.3s;
    }
    #hud-signal-zone {
      font-size: var(--lbh-couch-small);
      letter-spacing: 0;
    }
    #hud-fuel {
      color: var(--lbh-ecology);
      text-shadow: 0 0 6px rgba(56, 245, 138, 0.28);
    }
    #hud-fuel .hud-label {
      font-size: var(--lbh-couch-micro);
      letter-spacing: 0;
      color: rgba(56, 245, 138, 0.72);
      text-transform: uppercase;
    }
    #hud-fuel-bar {
      width: 100%; height: 18px;
      background: var(--lbh-track-bg);
      border: 1px solid rgba(234, 247, 255, 0.14);
      border-radius: 2px;
      margin: 4px 0 0;
      overflow: hidden;
    }
    #hud-fuel-fill {
      height: 100%;
      width: 0%;
      border-radius: 2px;
      transition: width 0.15s, background-color 0.3s;
    }
    #hud-fuel-readout {
      font-size: var(--lbh-couch-small);
      letter-spacing: 0;
    }
    #hud-hull {
      color: var(--lbh-text-primary);
      text-shadow: 0 0 6px rgba(234, 247, 255, 0.2);
    }
    #hud-hull .hud-label { color: var(--lbh-text-muted); }
    #hud-hull-bar {
      width: 100%; height: 18px;
      background: var(--lbh-track-bg);
      border: 1px solid rgba(234, 247, 255, 0.14);
      border-radius: 2px;
      margin: 4px 0 0;
      overflow: hidden;
    }
    #hud-hull-fill {
      height: 100%;
      width: 100%;
      background: rgba(234, 247, 255, 0.76);
      transition: width 0.15s linear, background-color 0.2s linear;
    }
    #hud-hull-fill[data-tone="shielded"] { background: var(--lbh-portal); }
    #hud-hull-fill[data-tone="critical"] { background: var(--lbh-danger); }
    #hud-hull-readout[data-tone="shielded"] { color: var(--lbh-portal); }
    #hud-hull-readout[data-tone="critical"] { color: var(--lbh-danger); }
    #hud-inhibitor {
      top: 356px; left: var(--lbh-edge-margin);
      width: 254px;
      color: var(--lbh-inhibitor);
      text-shadow: 0 0 8px var(--lbh-inhibitor-glow);
      line-height: 1.4;
      border-color: rgba(255, 62, 181, 0.24);
      animation: inhibitorPulse 2.4s ease-in-out infinite;
    }
    #hud-inhibitor .hud-label {
      font-size: var(--lbh-couch-micro);
      letter-spacing: 0;
      color: rgba(255, 120, 205, 0.72);
      text-transform: uppercase;
    }
    #hud-inhibitor-form {
      font-size: var(--lbh-couch-body);
      text-transform: lowercase;
      font-weight: 600;
      line-height: 1.05;
    }
    #hud-inhibitor.form-vessel {
      color: rgba(255, 70, 150, 1.0);
      text-shadow: 0 0 12px rgba(255, 70, 150, 0.7);
      animation: inhibitorPulseVessel 1.4s ease-in-out infinite;
    }
    @keyframes inhibitorPulse {
      0%, 100% { opacity: 0.8; }
      50% { opacity: 1.0; }
    }
    @keyframes inhibitorPulseVessel {
      0%, 100% { opacity: 0.85; }
      50% { opacity: 1.0; }
    }
    #hud-portals {
      top: 12px; right: var(--lbh-edge-margin);
      width: 292px;
      text-align: right;
      color: var(--lbh-portal);
      text-shadow: 0 0 6px rgba(0, 226, 255, 0.32);
      line-height: 1.5;
      border-color: rgba(0, 226, 255, 0.18);
    }
    #hud-portals .hud-label {
      font-size: var(--lbh-couch-micro);
      letter-spacing: 0;
      color: rgba(0, 226, 255, 0.62);
      text-transform: uppercase;
    }
    #hud-portals .hud-value {
      font-size: 20px;
      font-weight: 650;
    }
    #hud-portals .hud-sub {
      font-size: var(--lbh-couch-micro);
      color: var(--lbh-text-muted);
    }
    #hud-portals [data-tone="critical"] { color: var(--lbh-danger); }
    #hud-portals [data-tone="active"] { color: var(--lbh-portal); }
    #hud-salvage {
      bottom: var(--lbh-edge-margin); left: var(--lbh-edge-margin);
      width: 254px;
      color: var(--lbh-salvage);
      text-shadow: 0 0 6px rgba(255, 185, 56, 0.32);
      line-height: 1.5;
      border-color: rgba(255, 185, 56, 0.2);
    }
    #hud-salvage .hud-sub {
      font-size: var(--lbh-couch-micro);
      color: rgba(190, 165, 90, 0.7);
      display: grid;
      gap: 3px;
    }
    #hud-scavengers {
      display: none;  /* hidden — scavenger count is better as organic discovery */
    }
    #hud-signature {
      top: 18px; left: 50%;
      transform: translateX(-50%);
      text-align: center;
      font-size: var(--lbh-couch-micro);
      color: rgba(140, 170, 190, 0.5);
      text-shadow: 0 0 4px rgba(140, 170, 190, 0.2);
      background: none;
      border: none;
      padding: 0;
    }
    #hud-actions {
      right: var(--lbh-edge-margin);
      bottom: var(--lbh-edge-margin);
      width: 348px;
      display: grid;
      gap: var(--lbh-deck-panel-gap);
      padding: 14px 18px;
      border-color: rgba(0, 226, 255, 0.2);
    }
    #hud-pulse {
      font-size: var(--lbh-couch-small);
      color: rgba(200, 180, 100, 0.7);
      text-shadow: 0 0 4px rgba(200, 180, 100, 0.2);
      min-height: 48px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 2px 12px;
      align-items: baseline;
    }
    #hud-pulse.ready {
      color: rgba(100, 220, 160, 0.8);
      text-shadow: 0 0 6px rgba(100, 220, 160, 0.3);
    }
    .hud-command-label {
      color: var(--lbh-text-primary);
      font-size: var(--lbh-couch-body);
      font-weight: 650;
      text-transform: uppercase;
    }
    .hud-command-state { text-align: right; }
    #hud-pulse .hud-action-caption { grid-column: 1 / -1; }
    #hud-abilities {
      width: 100%;
      font-size: var(--lbh-couch-micro);
      line-height: 1.45;
      display: grid;
      gap: 10px;
    }
    .hud-ability {
      color: rgba(160, 170, 180, 0.6);
      display: grid;
      grid-template-columns: 1fr;
      gap: 3px;
      min-height: 78px;
      padding-top: 9px;
      border-top: 1px solid rgba(0, 226, 255, 0.12);
    }
    .hud-ability-line {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      min-height: 18px;
    }
    .hud-ability-name {
      font-size: var(--lbh-couch-small);
      text-transform: uppercase;
      font-weight: 650;
    }
    .hud-ability.active .hud-ability-name {
      color: rgba(100, 255, 200, 0.9);
      text-shadow: 0 0 6px rgba(100, 255, 200, 0.3);
    }
    .hud-ability.cooldown .hud-ability-status {
      color: rgba(200, 160, 80, 0.6);
    }
    .hud-ability.ready .hud-ability-name {
      color: rgba(180, 200, 220, 0.8);
    }
    .hud-ability.ready,
    .hud-ability.active {
      padding: 9px 10px 8px;
      margin: 0 -10px;
      border-left: 2px solid rgba(0, 226, 255, 0.72);
      background: rgba(0, 226, 255, 0.07);
    }
    .hud-ability-detail {
      color: rgba(154, 180, 206, 0.64);
      font-size: var(--lbh-couch-small);
      max-width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .hud-ability-meter {
      height: 16px;
      width: 100%;
      background: rgba(90,110,130,0.24);
      border: 1px solid rgba(234,247,255,0.12);
      margin: 2px 0;
      overflow: hidden;
    }
    .hud-ability-meter-fill {
      height: 100%;
      transition: width 0.12s linear, background-color 0.18s linear;
    }
    .hud-action-caption,
    .inv-caption {
      color: var(--lbh-text-muted);
      font-size: var(--lbh-couch-micro);
      font-weight: 500;
      line-height: 1.35;
    }
    .ui-action-glyph {
      display: inline-flex;
      min-width: 28px;
      min-height: 24px;
      padding: 0 5px;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      color: var(--lbh-text-primary);
      border: 1px solid rgba(234, 247, 255, 0.72);
      font-size: 10px;
      font-weight: 700;
      line-height: 1;
      vertical-align: middle;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .ui-action-glyph-face {
      min-width: 24px;
      padding: 0;
      border-radius: 50%;
    }
    .ui-action-glyph-dpad {
      position: relative;
      width: 28px;
      padding: 0;
      border: 0;
      font-size: 0;
    }
    .ui-action-glyph-dpad::before,
    .ui-action-glyph-dpad::after {
      content: '';
      position: absolute;
      left: 50%;
      top: 50%;
      background: var(--lbh-text-primary);
      transform: translate(-50%, -50%);
    }
    .ui-action-glyph-dpad::before { width: 8px; height: 26px; }
    .ui-action-glyph-dpad::after { width: 26px; height: 8px; }
    .ui-action-glyph-shoulder,
    .ui-action-glyph-trigger,
    .ui-action-glyph-system,
    .ui-action-glyph-keycap { border-radius: 2px; }
    .ui-action-copy { vertical-align: middle; }
    #hud-interaction {
      left: 50%;
      bottom: 24px;
      width: min(380px, calc(100vw - 520px));
      min-width: 320px;
      transform: translateX(-50%);
      text-align: center;
      border-color: rgba(0, 226, 255, 0.5);
      background: rgba(0, 4, 18, 0.9);
    }
    #hud-interaction-action {
      color: var(--lbh-text-primary);
      font-size: var(--lbh-couch-body);
      font-weight: 700;
      text-transform: uppercase;
    }
    #hud-interaction-detail { color: var(--lbh-text-muted); margin-top: 3px; }
    #hud-interaction-caption { color: var(--lbh-portal); margin-top: 5px; }
    #hud-portal-arrow {
      position: absolute;
      bottom: 50%;
      left: 50%;
      width: 0; height: 0;
      pointer-events: none;
    }
    /* Events log — left side, stacks entries, fades by age (like MMO chat) */
    #hud-warnings {
      position: absolute;
      bottom: 102px;
      left: var(--lbh-edge-margin);
      width: 320px;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 3px;
      pointer-events: none;
    }
    .hud-warning {
      font-size: var(--lbh-couch-micro);
      font-weight: normal;
      letter-spacing: 0;
      text-shadow: 0 0 6px var(--lbh-warning-shadow);
      opacity: 0;
      padding: 2px 0;
      animation: hud-warning-in 0.2s ease-out forwards;
    }
    .hud-zalgo {
      display: inline-block;
      line-height: 1.05;
      text-shadow:
        0 0 9px rgba(204, 26, 128, 0.75),
        0 0 2px rgba(255, 255, 255, 0.5);
    }
    .hud-warning.hud-zalgo {
      letter-spacing: 0;
      padding: 4px 0;
    }
    .hud-warning.fading {
      animation: hud-warning-out 1.0s ease-in forwards;
    }
    @keyframes hud-warning-in {
      from { opacity: 0; transform: translateX(-8px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes hud-warning-out {
      from { opacity: 1; }
      to { opacity: 0; }
    }
    /* Inventory panel (Tab toggle) — terminal card */
    #hud-inventory-panel {
      position: absolute;
      left: var(--lbh-edge-margin);
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0, 2, 10, 0.94);
      border: 1px solid rgba(0, 226, 255, 0.26);
      border-radius: 2px;
      padding: 14px 18px;
      width: min(420px, calc(100vw - 48px));
      min-width: min(360px, calc(100vw - 48px));
      max-width: 420px;
      font-size: var(--lbh-couch-small);
      color: var(--lbh-text-primary);
      line-height: 1.6;
      display: none;
      pointer-events: auto;
      box-shadow: var(--lbh-panel-shadow), inset 0 0 30px rgba(0, 0, 20, 0.3);
      text-shadow: var(--lbh-text-shadow);
    }
    #hud-inventory-panel.open { display: block; }
    #hud-inventory-panel .inv-header {
      font-size: var(--lbh-couch-micro);
      letter-spacing: 0;
      text-transform: uppercase;
      color: var(--lbh-text-muted);
      border-bottom: 1px solid rgba(0, 226, 255, 0.14);
      padding-bottom: 4px;
      margin-bottom: 6px;
      display: grid;
      gap: 3px;
    }
    #hud-inventory-panel .inv-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      margin: 3px 0;
      border-radius: 1px;
      transition: background 0.1s;
      min-height: var(--lbh-deck-row-min);
    }
    #hud-inventory-panel .inv-item:hover {
      background: rgba(80, 100, 160, 0.12);
    }
    #hud-inventory-panel .inv-item .inv-name {
      flex: 1;
      font-size: var(--lbh-couch-small);
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #hud-inventory-panel .inv-icon {
      position: relative;
      flex: 0 0 var(--lbh-deck-icon-min);
      width: var(--lbh-deck-icon-min);
      height: var(--lbh-deck-icon-min);
      margin-right: 0;
      overflow: hidden;
      background: rgba(0, 0, 8, 0.68);
      border: 1px solid rgba(234, 247, 255, 0.28);
      box-shadow: 2px 3px 5px rgba(0, 0, 8, 0.86);
    }
    #hud-inventory-panel .inv-icon img { width: 100%; height: 100%; display: block; image-rendering: auto; }
    #hud-inventory-panel .inv-icon[data-tier="uncommon"] { border-color: rgba(56, 245, 138, 0.66); }
    #hud-inventory-panel .inv-icon[data-tier="rare"] { border-color: rgba(0, 226, 255, 0.76); }
    #hud-inventory-panel .inv-icon[data-tier="unique"] { border-color: rgba(255, 185, 56, 0.82); }
    #hud-inventory-panel .inv-icon.is-selected { box-shadow: 0 0 0 1px rgba(0, 226, 255, 0.9), 2px 3px 5px rgba(0, 0, 8, 0.86); }
    #hud-inventory-panel .inv-icon-equipped::after,
    #hud-inventory-panel .inv-icon-consumable::after {
      content: '';
      position: absolute;
      right: 2px;
      top: 2px;
      bottom: 2px;
      width: 3px;
      background: var(--lbh-signal);
    }
    #hud-inventory-panel .inv-icon-consumable::after {
      left: 2px; right: 2px; top: auto; bottom: 2px; width: auto; height: 3px;
      background: var(--lbh-salvage);
    }
    #hud-inventory-panel .inv-icon-missing { opacity: 0.35; }
    #hud-inventory-panel .inv-item .inv-cat {
      font-size: var(--lbh-couch-micro);
      margin-left: 8px;
      opacity: 0.45;
      letter-spacing: 0;
      max-width: 34%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #hud-inventory-panel .inv-item .inv-drop {
      margin-left: 8px;
      color: rgba(255, 100, 80, 0.6);
      font-size: var(--lbh-couch-micro);
      letter-spacing: 0;
    }
    #hud-inventory-panel .inv-empty {
      color: rgba(110, 120, 140, 0.5);
      font-size: var(--lbh-couch-micro);
    }
    #hud-inventory-panel .inv-section {
      margin-top: 8px;
      padding-top: 6px;
      border-top: 1px solid rgba(80, 100, 140, 0.12);
    }
    #hud[data-reduced-motion="true"] *,
    #hud[data-reduced-motion="true"] *::before,
    #hud[data-reduced-motion="true"] *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
    }
    @media (prefers-reduced-motion: reduce) {
      #hud *, #hud *::before, #hud *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    }
  </style>
</head>
<body>
  <canvas id="fluid-canvas"></canvas>
  <canvas id="three-canvas"></canvas>
  <canvas id="overlay-canvas"></canvas>
  <div id="min-window-overlay">
    <div class="min-window-title">resize to play</div>
    <div>window is smaller than the minimum render area.</div>
    <div class="min-window-hint">need at least 800 x 450. fullscreen works on any monitor.</div>
  </div>
  <div id="hud" style="display:none;">
    <div id="hud-collapse" class="hud-panel">
      <div class="hud-label">universal collapse</div>
      <div class="hud-value" id="hud-collapse-timer">10:00</div>
      <div class="hud-sub" id="hud-collapse-event"></div>
    </div>
    <div id="hud-vitals" class="hud-panel" role="group" aria-label="ship status">
      <div id="hud-fuel" class="hud-vital">
        <div class="hud-vital-head"><div class="hud-label">propulsion heat</div><div id="hud-fuel-readout" class="hud-vital-readout">0%</div></div>
        <div id="hud-fuel-bar" role="progressbar" aria-label="propulsion heat" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="hud-fuel-fill"></div></div>
      </div>
      <div id="hud-hull" class="hud-vital">
        <div class="hud-vital-head"><div class="hud-label">hull</div><div id="hud-hull-readout" class="hud-vital-readout">nominal</div></div>
        <div id="hud-hull-bar" role="progressbar" aria-label="hull condition" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><div id="hud-hull-fill"></div></div>
      </div>
      <div id="hud-signal" class="hud-vital">
        <div class="hud-vital-head"><div class="hud-label">signal</div><div id="hud-signal-zone" class="hud-vital-readout">ghost</div></div>
        <div id="hud-signal-bar" role="progressbar" aria-label="signal level" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="hud-signal-fill"></div></div>
      </div>
    </div>
    <div id="hud-inhibitor" class="hud-panel" style="display: none;">
      <div class="hud-label">inhibitor</div>
      <div id="hud-inhibitor-form">dormant</div>
    </div>
    <div id="hud-portals" class="hud-panel">
      <div class="hud-label">route objective</div>
      <div class="hud-value" id="hud-portals-status">route closed</div>
      <div class="hud-sub" id="hud-portals-next"></div>
    </div>
    <div id="hud-salvage" class="hud-panel">
      <div id="hud-salvage-count"></div>
      <div class="hud-sub" id="hud-salvage-value"></div>
    </div>
    <div id="hud-scavengers" class="hud-panel">
      <div id="hud-scavengers-count"></div>
      <div class="hud-sub" id="hud-scavengers-sub"></div>
    </div>
    <div id="hud-actions" class="hud-panel" role="group" aria-label="ship actions">
      <div id="hud-pulse" class="hud-command"></div>
      <div id="hud-abilities">
        <div id="hud-ability1" class="hud-ability"><span class="hud-ability-name">---</span> <span class="hud-ability-status"></span></div>
        <div id="hud-ability2" class="hud-ability"><span class="hud-ability-name">---</span> <span class="hud-ability-status"></span></div>
      </div>
    </div>
    <div id="hud-signature" class="hud-panel"></div>
    <div id="hud-interaction" class="hud-panel" role="status" aria-live="polite" style="display:none;">
      <div id="hud-interaction-action"></div>
      <div id="hud-interaction-detail"></div>
      <div id="hud-interaction-caption" class="hud-action-caption"></div>
    </div>
    <div id="hud-portal-arrow"></div>
    <div id="hud-inventory-panel"></div>
    <div id="hud-warnings" role="log" aria-live="polite" aria-relevant="additions"></div>
  </div>
  <script>
    window.__LBH_BOOT_STATE__ = { stage: 'html', at: Date.now(), details: null };
    window.__LBH_BOOT_MARK__ = function(stage, details) {
      window.__LBH_BOOT_STATE__ = { stage, at: Date.now(), details: details || null };
      console.log('[LBH boot]', stage, details || '');
    };
    window.__LBH_SHOW_BOOT_ERROR__ = function(message, detail) {
      console.error('[LBH boot fatal]', message, detail || '');
      var div = document.createElement('div');
      div.style.cssText = 'position:fixed;inset:0;z-index:999999;display:grid;place-items:center;background:#02050c;color:#e8f6ff;font:15px monospace;padding:24px;';
      div.innerHTML = '<main style="max-width:820px;border:1px solid #7b1f2a;background:#100812;padding:24px;line-height:1.45;">'
        + '<h1 style="margin:0 0 12px;color:#ff4b3a;font-size:24px;">Last Singularity failed to boot</h1>'
        + '<pre style="white-space:pre-wrap;margin:0;color:#d8e8ff;"></pre>'
        + '</main>';
      div.querySelector('pre').textContent = String(message || 'Unknown boot failure')
        + (detail ? '\n\n' + String(detail) : '');
      document.body.appendChild(div);
    };
    window.addEventListener('error', function(event) {
      window.__LBH_SHOW_BOOT_ERROR__(
        event.message || 'Uncaught boot error',
        [event.filename, event.lineno, event.colno].filter(Boolean).join(':')
      );
    });
    window.addEventListener('unhandledrejection', function(event) {
      var reason = event.reason || {};
      window.__LBH_SHOW_BOOT_ERROR__(
        reason.message || 'Unhandled boot rejection',
        reason.stack || String(reason)
      );
    });
  </script>
  <script src="src/build-flags.js" onerror="window.__LBH_SHOW_BOOT_ERROR__('Failed to load src/build-flags.js')"></script>
  <script type="module" src="src/main.js" onerror="window.__LBH_SHOW_BOOT_ERROR__('Failed to load src/main.js')"></script>
</body>
</html>
