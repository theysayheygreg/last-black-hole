# Packaging template only. Replace every REPLACE_* value explicitly; do not deploy this file as-is.
app = "REPLACE_APP"
primary_region = "REPLACE_REGION"

[build]
  dockerfile = "Dockerfile.v04-benchmark"

[env]
  HOST = "0.0.0.0"
  PORT = "8080"
  LBH_BENCH_PROTOCOL = "s20-v1+brotli-q1"
  LBH_BENCH_AUTHORITY_PROCESSES = "1"
  LBH_BENCH_MAX_SEATS = "4"
  LBH_BENCH_RETRIES = "0"
  LBH_BENCH_PROVIDER = "fly"
  LBH_BENCH_REGION = "REPLACE_REGION"
  LBH_BENCH_HOST_CLASS = "performance-1x"
  LBH_BENCH_ORG = "REPLACE_ORG"
  LBH_BENCH_INVOICE_REF = "REPLACE_INVOICE_OR_RATE_CARD_REF"
  LBH_BENCH_CURRENCY = "REPLACE_CURRENCY"
  LBH_BENCH_COMPUTE_RATE = "REPLACE_COMPUTE_RATE"
  LBH_BENCH_EGRESS_RATE = "REPLACE_EGRESS_RATE"
  LBH_BENCH_INVOICE_OBSERVED = "REPLACE_TRUE_OR_FALSE"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "20s"
    interval = "10s"
    method = "GET"
    timeout = "2s"
    path = "/health"

[[vm]]
  cpu_kind = "performance"
  cpus = 1
  memory = "2gb"

[processes]
  app = "node scripts/v04-authority-benchmark-entrypoint.cjs"

[[restart]]
  policy = "no"
  processes = ["app"]

# Capture signer material and any control-plane credentials must be injected at
# execution through Fly secrets or a read-only secret mount. Never add them to
# this file, Docker build args, image labels, or evidence output.
