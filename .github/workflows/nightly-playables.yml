name: Latest Playtest

on:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: lbh-latest-playtest
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  RELEASE_TAG: nightly-latest

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.changes.outputs.should_build }}
      published_sha: ${{ steps.changes.outputs.published_sha }}
    steps:
      - name: Compare source with rolling release
        id: changes
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName === 'workflow_dispatch') {
              core.setOutput('should_build', 'true');
              core.setOutput('published_sha', 'manual');
              return;
            }

            const { owner, repo } = context.repo;
            try {
              const ref = await github.rest.git.getRef({
                owner,
                repo,
                ref: 'tags/nightly-latest',
              });
              const publishedSha = ref.data.object.sha;
              core.setOutput('published_sha', publishedSha);
              core.setOutput('should_build', publishedSha === context.sha ? 'false' : 'true');
              core.info(
                publishedSha === context.sha
                  ? `Rolling release already contains ${context.sha}; skipping.`
                  : `Rolling release is ${publishedSha}; building ${context.sha}.`,
              );
            } catch (error) {
              if (error.status !== 404) throw error;
              core.info('No rolling release tag exists; building.');
              core.setOutput('published_sha', 'none');
              core.setOutput('should_build', 'true');
            }

  validate-source:
    needs: detect-changes
    if: needs.detect-changes.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Run deterministic release validation
        run: >-
          node tests/run-all.cjs
          --lane=fast
          --suite=Validation,PushScope,Signatures,Items,Balance,SimProtocol,DesktopPackage,DeckGamingMode,DeckInstaller,SteamDeckCompat,PlayInstructions,CloudflareDrop,TextCorruption,Typography,UIPrimitives,UIMotion,VFX
          --renderer=three
          --no-retries

  build-web-ipad:
    needs: [detect-changes, validate-source]
    if: needs.detect-changes.outputs.should_build == 'true'
    env:
      ENABLE_GITHUB_PAGES: ${{ vars.LBH_ENABLE_GITHUB_PAGES == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Build web and iPad playables
        run: node scripts/build.cjs --targets=web,ipad --mode=release
      - run: node scripts/ci/package-nightly-assets.cjs
      - name: Package browser playables
        working-directory: dist/nightly
        run: |
          zip -rq last-singularity-web-nightly.zip web START-HERE.md BUILD-MANIFEST.json nightly-assets.json
          zip -rq last-singularity-ipad-nightly.zip ipad START-HERE.md BUILD-MANIFEST.json nightly-assets.json
          cp BUILD-MANIFEST.json BUILD-MANIFEST-web-ipad.json
      - name: Upload GitHub Pages artifact
        if: env.ENABLE_GITHUB_PAGES == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/nightly/web
      - uses: actions/upload-artifact@v4
        with:
          name: latest-browser-playables
          retention-days: 14
          path: |
            dist/nightly/last-singularity-web-nightly.zip
            dist/nightly/last-singularity-ipad-nightly.zip
            dist/nightly/BUILD-MANIFEST-web-ipad.json

  build-win:
    needs: [detect-changes, validate-source]
    if: needs.detect-changes.outputs.should_build == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Parse native Windows installer
        shell: pwsh
        run: '[void][scriptblock]::Create((Get-Content scripts/install.ps1 -Raw))'
      - run: node scripts/build.cjs --targets=win --mode=release
      - run: node scripts/ci/package-nightly-assets.cjs
      - name: Package Windows playable
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/nightly/Last Singularity-win32-x64","dist/nightly/START-HERE.md","dist/nightly/BUILD-MANIFEST.json","dist/nightly/nightly-assets.json" -DestinationPath "dist/nightly/last-singularity-win-nightly.zip" -Force
          Copy-Item "dist/nightly/BUILD-MANIFEST.json" "dist/nightly/BUILD-MANIFEST-win.json"
      - uses: actions/upload-artifact@v4
        with:
          name: latest-windows-playable
          retention-days: 14
          path: |
            dist/nightly/last-singularity-win-nightly.zip
            dist/nightly/BUILD-MANIFEST-win.json

  build-linux:
    needs: [detect-changes, validate-source]
    if: needs.detect-changes.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: node scripts/build.cjs --targets=linux --mode=release
      - run: node scripts/ci/package-nightly-assets.cjs
      - name: Package Linux and Steam Deck playable
        working-directory: dist/nightly
        run: |
          zip -rq last-singularity-linux-nightly.zip "Last Singularity-linux-x64" START-HERE.md BUILD-MANIFEST.json nightly-assets.json install-steam-shortcut.py
          cp BUILD-MANIFEST.json BUILD-MANIFEST-linux.json
      - uses: actions/upload-artifact@v4
        with:
          name: latest-linux-playable
          retention-days: 14
          path: |
            dist/nightly/last-singularity-linux-nightly.zip
            dist/nightly/BUILD-MANIFEST-linux.json

  build-mac:
    needs: [detect-changes, validate-source]
    if: needs.detect-changes.outputs.should_build == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: node scripts/build.cjs --targets=mac --mode=release
      - run: node scripts/ci/package-nightly-assets.cjs
      - name: Package macOS playable
        working-directory: dist/nightly
        run: |
          ditto -c -k --sequesterRsrc --keepParent "Last Singularity.app" last-singularity-mac-nightly.zip
          zip -q last-singularity-mac-nightly.zip START-HERE.md BUILD-MANIFEST.json nightly-assets.json
          cp BUILD-MANIFEST.json BUILD-MANIFEST-mac.json
      - uses: actions/upload-artifact@v4
        with:
          name: latest-macos-playable
          retention-days: 14
          path: |
            dist/nightly/last-singularity-mac-nightly.zip
            dist/nightly/BUILD-MANIFEST-mac.json

  deploy-pages:
    if: needs.detect-changes.outputs.should_build == 'true' && vars.LBH_ENABLE_GITHUB_PAGES == 'true'
    needs: [detect-changes, build-web-ipad]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy web playable
        id: deployment
        uses: actions/deploy-pages@v4

  publish-release:
    needs: [detect-changes, build-web-ipad, build-win, build-linux, build-mac]
    if: needs.detect-changes.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: latest-*-playable*
          path: release-assets
          merge-multiple: true
      - name: Add source, installer, and checksum contracts
        run: |
          cp scripts/install.sh scripts/install.ps1 scripts/install-steam-shortcut.py release-assets/
          node -e '
            const fs = require("fs");
            const manifestFiles = [
              "BUILD-MANIFEST-web-ipad.json",
              "BUILD-MANIFEST-win.json",
              "BUILD-MANIFEST-linux.json",
              "BUILD-MANIFEST-mac.json"
            ];
            const manifests = manifestFiles.map((name) =>
              JSON.parse(fs.readFileSync(`release-assets/${name}`, "utf8"))
            );
            const versions = new Set(manifests.map((manifest) => manifest.version));
            if (versions.size !== 1) throw new Error("platform build versions do not match");
            fs.writeFileSync("release-assets/BUILD-MANIFEST.json", JSON.stringify({
              sourceSha: process.env.GITHUB_SHA,
              version: manifests[0].version,
              mode: "release",
              targets: ["web", "ipad", "mac", "win", "linux"],
              platformManifests: manifestFiles
            }, null, 2) + "\n");
            fs.writeFileSync("release-assets/SOURCE.json", JSON.stringify({
              sourceSha: process.env.GITHUB_SHA,
              repository: process.env.GITHUB_REPOSITORY,
              workflowRun: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
              channel: "rolling-latest",
              mutable: true
            }, null, 2) + "\n");
          '
          cd release-assets
          sha256sum *.zip > SHA256SUMS
      - name: Write rolling release notes
        run: |
          cat > release-notes.md <<EOF
          # Latest Last Singularity Playtest

          This is the mutable rolling playtest channel built from \`${GITHUB_SHA}\`.
          It contains web, iPad, macOS Apple silicon, Windows x64, and Linux x64 / Steam Deck playables.

          Linux, macOS, or Steam Deck:

          \`\`\`sh
          curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/download/nightly-latest/install.sh | sh
          \`\`\`

          Windows PowerShell:

          \`\`\`powershell
          irm https://github.com/${GITHUB_REPOSITORY}/releases/download/nightly-latest/install.ps1 | iex
          \`\`\`

          This tag moves when a new weekly build is published. Final displaced versions remain immutable on the [Old Versions](https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/public/OLD-VERSIONS.md) page.
          EOF
      - name: Move rolling tag and publish assets
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${RELEASE_TAG}" \
              -f sha="${GITHUB_SHA}" -F force=true >/dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${RELEASE_TAG}" -f sha="${GITHUB_SHA}" >/dev/null
          fi

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" \
              --title "Latest Playtest" --notes-file release-notes.md --prerelease
          else
            gh release create "${RELEASE_TAG}" \
              --target "${GITHUB_SHA}" --title "Latest Playtest" \
              --notes-file release-notes.md --prerelease
          fi

          gh release upload "${RELEASE_TAG}" release-assets/* --clobber
      - name: Verify published rolling release
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" > published-release.json
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" > published-tag.json
          node - <<'NODE'
          const fs = require('fs');
          const assert = require('assert');
          const release = JSON.parse(fs.readFileSync('published-release.json'));
          const tag = JSON.parse(fs.readFileSync('published-tag.json'));
          const required = [
            'last-singularity-web-nightly.zip',
            'last-singularity-ipad-nightly.zip',
            'last-singularity-mac-nightly.zip',
            'last-singularity-win-nightly.zip',
            'last-singularity-linux-nightly.zip',
            'BUILD-MANIFEST.json',
            'SOURCE.json',
            'SHA256SUMS',
            'install.sh',
            'install.ps1',
            'install-steam-shortcut.py',
          ];
          const assets = new Map(release.assets.map((asset) => [asset.name, asset]));
          for (const name of required) {
            assert(assets.has(name), `rolling release is missing ${name}`);
            assert(/^sha256:[0-9a-f]{64}$/.test(assets.get(name).digest || ''), `${name} has no GitHub SHA-256 digest`);
          }
          assert.equal(tag.object.sha, process.env.GITHUB_SHA, 'rolling tag does not match built source');
          console.log(`Verified ${required.length} rolling release assets at ${process.env.GITHUB_SHA}.`);
          NODE
